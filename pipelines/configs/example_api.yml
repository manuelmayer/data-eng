# ==============================================================================
# Plantilla de configuración de pipeline — Extracción desde API REST
#
# Instrucciones:
#   1. Copiar este archivo con un nombre descriptivo: <nombre_pipeline>.yml
#   2. Completar todos los campos requeridos (marcados con "# requerido")
#   3. El DAG se generará automáticamente al iniciar Airflow
# ==============================================================================

# --- Configuración del DAG (Airflow) ---
dag_id: landing_example_api            # requerido — identificador único del DAG en Airflow
pipeline_name: example_api             # requerido — prefijo usado en la ruta de MinIO
schedule: "@daily"                     # requerido — cron o preset de Airflow (@daily, @hourly, null)
start_date: "2025-01-01"              # requerido — formato YYYY-MM-DD
catchup: false                         # ejecutar corridas históricas pendientes
retries: 1                             # intentos ante fallo de tarea
tags:                                  # etiquetas visibles en la UI de Airflow
  - landing
  - api

# --- Configuración del origen ---
source_type: api                       # requerido — determina el script de extracción a invocar
                                       # Valores soportados: api

# --- Parámetros de la API ---
url: https://api.example.com/v1/data  # requerido — endpoint HTTP GET
data_key: null                         # clave raíz del JSON si la respuesta es un objeto
                                       # Ejemplo: data_key: results → extrae response["results"]
                                       # null si la respuesta ya es una lista

params:                                # query parameters opcionales
  # page: 1
  # limit: 100

headers:                               # headers HTTP opcionales (User-Agent se agrega automáticamente)
  # Authorization: Bearer <token>
  # Accept: application/json
