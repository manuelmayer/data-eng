[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-length gestionado por ruff-format
]

[tool.ruff.lint.isort]
known-first-party = ["pipelines"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
