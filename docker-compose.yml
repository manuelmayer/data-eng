services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio_datalake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /bitnami/minio/data --console-address ":9001"
    volumes:
      - minio_storage:/bitnami/minio/data

volumes:
  minio_storage: